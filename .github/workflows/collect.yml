name: Collect weather + GitHub

# Fallback sender for weather + GitHub. Normally the VPS does this (host/vps/, a systemd timer
# running the "collector" compose service), so this workflow stays off.
#
# Off until you set the repository variable COLLECT_ENABLED=true.
#
# Settings -> Secrets and variables -> Actions:
#   secrets:   LARAPAPER_WEBHOOK_URL, LARAPAPER_WEBHOOK_TOKEN, LAT, LON
#              (secrets, not variables: this repo is public and variables show up in the logs)
#   variables: COLLECT_ENABLED, TZ, WEATHER_UNIT, GH_USERNAME, GH_WEEKS, HEATMAP_STYLE

on:
  schedule:
    - cron: "*/15 * * * *" # GitHub may delay scheduled runs; fine for weather
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    if: vars.COLLECT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: collector
    env:
      LARAPAPER_WEBHOOK_URL: ${{ secrets.LARAPAPER_WEBHOOK_URL }}
      LARAPAPER_WEBHOOK_TOKEN: ${{ secrets.LARAPAPER_WEBHOOK_TOKEN }}
      LAT: ${{ secrets.LAT }}
      LON: ${{ secrets.LON }}
      TZ: ${{ vars.TZ }}
      WEATHER_UNIT: ${{ vars.WEATHER_UNIT }}
      GH_USERNAME: ${{ vars.GH_USERNAME || github.repository_owner }}
      GH_WEEKS: ${{ vars.GH_WEEKS }}
      HEATMAP_STYLE: ${{ vars.HEATMAP_STYLE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      - run: uv run --no-dev zectrix-collect --only weather,github
