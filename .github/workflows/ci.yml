name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
          # sha256 of gitleaks_8.28.0_linux_x64.tar.gz from the release's checksums.txt
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --verbose .

  changes:
    runs-on: ubuntu-latest
    outputs:
      collector: ${{ steps.filter.outputs.collector }}
      firmware: ${{ steps.filter.outputs.firmware }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            collector:
              - 'collector/**'
              - 'schema/**'
            firmware:
              - 'firmware/**'

  collector:
    needs: changes
    if: needs.changes.outputs.collector == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pytest -q

  firmware:
    needs: changes
    if: needs.changes.outputs.firmware == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      PLATFORMIO_VERSION: 6.1.19
    defaults:
      run:
        working-directory: firmware/trmnl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.platformio
            firmware/trmnl/managed_components
          key: pio-${{ env.PLATFORMIO_VERSION }}-${{ runner.os }}-${{ hashFiles('firmware/trmnl/platformio.ini', 'firmware/trmnl/dependencies.lock.esp32s3') }}
      # Pinned: 6.2.0 pulls SCons 4.11, which the espressif32 build scripts can't import
      # (ModuleNotFoundError: SCons.Tool.FortranCommon). Bump together with a local test build.
      - run: pip install platformio==${{ env.PLATFORMIO_VERSION }}
      - name: Unit tests (native)
        run: pio test -e native
      - name: Build NOTE4C firmware
        run: pio run -e zectrix_note4c
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zectrix_note4c-firmware-${{ github.sha }}
          # firmware.bin = app only, flash at 0x20000 (keeps Wi-Fi + pairing); see docs/flashing.md
          path: |
            firmware/trmnl/.pio/build/zectrix_note4c/firmware.bin
            firmware/trmnl/.pio/build/zectrix_note4c/merged_firmware.bin
          if-no-files-found: error
