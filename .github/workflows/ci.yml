name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run manually (Actions -> CI -> Run workflow) to also build the firmware. Pushes only run the
  # firmware unit tests: the firmware is built and flashed from your PC (just flash-app).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
          # sha256 of gitleaks_8.28.0_linux_x64.tar.gz from the release's checksums.txt
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --verbose .

  changes:
    runs-on: ubuntu-latest
    outputs:
      collector: ${{ steps.filter.outputs.collector }}
      firmware: ${{ steps.filter.outputs.firmware }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            collector:
              - 'collector/**'
              - 'schema/**'
            firmware:
              - 'firmware/**'

  collector:
    needs: changes
    if: needs.changes.outputs.collector == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pytest -q

  firmware:
    needs: changes
    if: needs.changes.outputs.firmware == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      PLATFORMIO_VERSION: 6.1.19
    defaults:
      run:
        working-directory: firmware/trmnl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio
            firmware/trmnl/managed_components
          key: pio-${{ env.PLATFORMIO_VERSION }}-${{ runner.os }}-${{ hashFiles('firmware/trmnl/platformio.ini', 'firmware/trmnl/dependencies.lock.esp32s3') }}
      # Pinned: 6.2.0 pulls SCons 4.11, which the espressif32 build scripts can't import
      # (ModuleNotFoundError: SCons.Tool.FortranCommon). Bump together with a local test build.
      - run: pip install platformio==${{ env.PLATFORMIO_VERSION }}
      - name: Unit tests (native)
        run: pio test -e native
      - name: Build NOTE4C firmware
        if: github.event_name == 'workflow_dispatch'
        run: pio run -e zectrix_note4c
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zectrix_note4c-firmware-${{ github.sha }}
          # firmware.bin = app only, flash at 0x20000 (keeps Wi-Fi + pairing); see docs/flashing.md
          path: |
            firmware/trmnl/.pio/build/zectrix_note4c/firmware.bin
            firmware/trmnl/.pio/build/zectrix_note4c/merged_firmware.bin
          if-no-files-found: error
