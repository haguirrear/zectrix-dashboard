# LaraPaper on the VPS, behind Cloudflare Tunnel and Caddy. See docs/deploy-vps.md.
#
#   docker compose up -d        (with COMPOSE_FILE=compose.prod.yml in .env)
#
# No port is reachable from outside the VPS:
# - cloudflared keeps an outbound connection to Cloudflare and hands requests to caddy:80.
# - Caddy allows only the device API, the rendered images and the token-checked webhook.
# - LaraPaper's 127.0.0.1:8080 is for `tailscale serve`, which publishes the admin UI on your tailnet.
#
# Each container gets only the variables it needs (no shared env_file): cloudflared never sees
# APP_KEY, LaraPaper never sees the tunnel token. Values come from .env next to this file.
name: larapaper # same project name as compose.yml, so the volume names match when migrating
services:
  larapaper:
    image: ghcr.io/usetrmnl/larapaper:0.47.0
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - APP_KEY=${APP_KEY:?set APP_KEY in .env}
      - APP_URL=${APP_URL:?set APP_URL in .env}
      - PHP_OPCACHE_ENABLE=1
      - TRMNL_PROXY_REFRESH_MINUTES=15
      - DB_DATABASE=database/storage/database.sqlite
      - APP_TIMEZONE=UTC
      - APP_ENV=production
      - FORCE_HTTPS=true
      # Only Caddy (Docker network) and tailscale serve (via the 127.0.0.1 port) can reach it.
      - TRUSTED_PROXIES=*
      - MULTIUSER_REGISTRATION_ENABLED=false
    volumes:
      - database:/var/www/html/database/storage
      - storage:/var/www/html/storage/app/public/images/generated
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2
    environment:
      - PUBLIC_HOST=${PUBLIC_HOST:?set PUBLIC_HOST in .env}
      - WEBHOOK_TOKEN=${WEBHOOK_TOKEN:?set WEBHOOK_TOKEN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - larapaper
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - caddy
    restart: unless-stopped

volumes:
  database:
  storage:
