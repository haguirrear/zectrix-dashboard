# LaraPaper on a VPS, behind Caddy. See docs/deploy-vps.md.
#
#   docker compose -f compose.prod.yml up -d
#
# - LaraPaper listens on 127.0.0.1:8080 only; nothing reaches it except Caddy.
# - Caddy uses host networking so it sees real client IPs and can bind the admin site to the
#   Tailscale address. Public: only the device API, generated images and the token-checked webhook.
# - Firewall on the VPS: allow 80/443 (and Tailscale's UDP); SSH only over Tailscale.
name: larapaper
services:
  app:
    image: ghcr.io/usetrmnl/larapaper:0.47.0
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env            # APP_KEY, APP_URL=https://<PUBLIC_HOST>, plus the Caddy variables below
    environment:
      - PHP_OPCACHE_ENABLE=1
      - TRMNL_PROXY_REFRESH_MINUTES=15
      - DB_DATABASE=database/storage/database.sqlite
      - APP_TIMEZONE=UTC
      - APP_ENV=production
      - FORCE_HTTPS=true
      - TRUSTED_PROXIES=127.0.0.1
      - MULTIUSER_REGISTRATION_ENABLED=false
    volumes:
      - database:/var/www/html/database/storage
      - storage:/var/www/html/storage/app/public/images/generated
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2
    network_mode: host
    env_file:
      - .env            # PUBLIC_HOST, ADMIN_HOST, TAILSCALE_IP, WEBHOOK_TOKEN, ACME_EMAIL
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Lets Caddy get the HTTPS certificate for the *.ts.net admin name from tailscaled
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
    depends_on:
      - app
    restart: unless-stopped

volumes:
  database:
  storage:
  caddy_data:
  caddy_config:
